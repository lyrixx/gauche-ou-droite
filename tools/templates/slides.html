<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
__FONTS__
<style>
/* Visionneuse statique : chaque <section> est une slide de 1920×1080, mise à l'échelle de la fenêtre. */
:root {
    --backdrop: #0d0e13;
    --chrome: #9a9fb0;
    --chrome-strong: #eceef4;
    --panel: #1c1e27;
    --line: #2f3240;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--backdrop); color: var(--chrome-strong); font: 400 15px/1.5 'Public Sans', system-ui, sans-serif; overflow: hidden; }

.stage { position: fixed; inset: 0 0 56px; display: grid; place-items: center; }
.deck { position: relative; width: 1920px; height: 1080px; transform-origin: center center; flex: none; }
.deck > section {
    position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
    line-height: 1.25; opacity: 0; visibility: hidden; transition: opacity 0.25s ease;
}
.deck > section.current { opacity: 1; visibility: visible; }
.deck > section * { margin: 0; }
.deck > section aside { display: none; }
.deck > section a { color: inherit; }
/* Apparitions au clic : data-build-in="<effet> <étape>", effet fade ou pop. */
.deck > section [data-build-in] { transition: opacity 0.3s ease, transform 0.3s ease; }
.deck > section [data-build-in].pending { opacity: 0; }
.deck > section [data-build-in^="pop"].pending { transform: scale(0.6); }
@media (prefers-reduced-motion: reduce) { .deck > section, .deck > section [data-build-in] { transition: none; } }

/* Éléments propres au format des slides */
x-shape { display: block; flex: none; }
x-shape[kind="arrow-right"] { clip-path: polygon(0 30%, 62% 30%, 62% 0, 100% 50%, 62% 100%, 62% 70%, 0 70%); }
x-shape[kind="arrow-left"] { clip-path: polygon(100% 30%, 38% 30%, 38% 0, 0 50%, 38% 100%, 38% 70%, 100% 70%); }
x-shape[kind="rounded"] { border-radius: 16px; }
x-shape[kind="ellipse"] { border-radius: 50%; }
.x-icon { flex: none; }

.bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56px; padding-inline: 16px;
    display: flex; align-items: center; gap: 12px; color: var(--chrome);
}
.bar .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .count { font-variant-numeric: tabular-nums; }
.bar button {
    font: inherit; color: var(--chrome-strong); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer;
}
.bar button:hover { border-color: var(--chrome); }
.bar button:focus-visible { outline: 2px solid var(--chrome-strong); outline-offset: 2px; }
.bar button[aria-pressed="true"] { background: var(--chrome-strong); color: var(--backdrop); }

.notes {
    position: fixed; left: 16px; right: 16px; bottom: 64px; max-width: 900px; margin-inline: auto; max-height: 40vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; font-size: 16px; line-height: 1.55;
}
.notes[hidden] { display: none; }
@media (max-width: 600px) { .bar .title { display: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="deck" id="deck">
__SLIDES__
    </div>
</div>
<div class="notes" id="notes" hidden></div>
<nav class="bar" aria-label="Navigation">
    <span class="title">__TITLE__</span>
    <button type="button" id="prev" aria-label="Slide précédente">←</button>
    <span class="count" id="count"></span>
    <button type="button" id="next" aria-label="Slide suivante">→</button>
    <button type="button" id="notes-toggle" aria-pressed="false" title="Notes de l'orateur (N)">Notes</button>
    <button type="button" id="full" title="Plein écran (F)">Plein écran</button>
</nav>
<script>
const slides = [...document.querySelectorAll('#deck > section')];
const deck = document.getElementById('deck');
const stage = document.getElementById('stage');
const notes = document.getElementById('notes');
let current = 0;
let step = 0;

const builds = slides.map((s) => [...s.querySelectorAll('[data-build-in]')].map((el) => ({ el, step: parseInt(el.dataset.buildIn.split(' ')[1], 10) })));
const steps = builds.map((b) => Math.max(0, ...b.map((x) => x.step)));

function fit() {
    const s = Math.min(stage.clientWidth / 1920, stage.clientHeight / 1080);
    deck.style.transform = `scale(${s})`;
    deck.style.margin = `${(1080 * s - 1080) / 2}px ${(1920 * s - 1920) / 2}px`;
}

function go(n, s = 0) {
    current = Math.max(0, Math.min(slides.length - 1, n));
    show(s);
    slides.forEach((s, i) => s.classList.toggle('current', i === current));
    document.getElementById('count').textContent = `${current + 1} / ${slides.length}`;
    const aside = slides[current].querySelector('aside');
    notes.textContent = aside ? aside.textContent : 'Pas de notes pour cette slide.';
    history.replaceState(null, '', '#' + (current + 1));
}

function show(s) {
    step = s;
    builds[current].forEach((b) => b.el.classList.toggle('pending', b.step > step));
}

function next() {
    if (step < steps[current]) show(step + 1);
    else go(current + 1);
}

// Revenir sur la slide précédente l'affiche complète, comme on l'a quittée.
function prev() {
    if (step > 0) show(step - 1);
    else if (current > 0) go(current - 1, steps[current - 1]);
}

function toggleNotes() {
    notes.hidden = !notes.hidden;
    document.getElementById('notes-toggle').setAttribute('aria-pressed', !notes.hidden);
}

function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
}

document.getElementById('prev').addEventListener('click', prev);
document.getElementById('next').addEventListener('click', next);
document.getElementById('notes-toggle').addEventListener('click', toggleNotes);
document.getElementById('full').addEventListener('click', toggleFull);
stage.addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    if (e.clientX < window.innerWidth / 3) prev();
    else next();
});
document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (['ArrowRight', 'PageDown', ' '].includes(k)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp'].includes(k)) { e.preventDefault(); prev(); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(slides.length - 1);
    else if (k === 'n' || k === 'N') toggleNotes();
    else if (k === 'f' || k === 'F') toggleFull();
});
window.addEventListener('resize', fit);
fit();
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
</html>
